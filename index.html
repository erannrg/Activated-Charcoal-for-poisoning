<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Tool 2026 - Table 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-strong { background-color: #059669; color: white; }
        .status-weak { background-color: #2563eb; color: white; }
        .status-none { background-color: #dc2626; color: white; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
<div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-black mb-2">Activated Charcoal Tool 2026</h1>
    <p class="text-slate-500 mb-8">Based on Table 4 - Clinical Toxicology Recommendations Collaborative</p>

    <div class="bg-white rounded-3xl shadow p-8 space-y-8">
        <!-- Drug -->
        <div>
            <label class="block text-sm font-bold text-slate-500 mb-2">1. Poison</label>
            <select id="drug" onchange="runRecommendation()" class="w-full p-4 border-2 rounded-2xl text-lg">
                <option value="">-- Select Poison --</option>
            </select>
        </div>

        <!-- Formulation -->
        <div>
            <label class="block text-sm font-bold text-slate-500 mb-2">2. Formulation</label>
            <div class="flex gap-4">
                <button onclick="setForm(this)" data-form="IR" class="form-btn flex-1 py-4 font-bold rounded-2xl border-2 border-slate-900 bg-slate-900 text-white">IR</button>
                <button onclick="setForm(this)" data-form="MR" class="form-btn flex-1 py-4 font-bold rounded-2xl border-2">MR / SR</button>
            </div>
        </div>

        <!-- Time -->
        <div>
            <label class="block text-sm font-bold text-slate-500 mb-2">3. Hours since ingestion</label>
            <input type="range" id="hours" min="0" max="24" step="0.1" value="2" class="w-full" oninput="runRecommendation()">
            <div class="text-center font-bold text-xl" id="hours_display">2.0 hours</div>
        </div>

        <!-- Dose -->
        <div>
            <label class="block text-sm font-bold text-slate-500 mb-2">4. Estimated Dose</label>
            <input type="text" id="dose" placeholder="e.g. 10 g or 250 mg/kg" 
                   class="w-full p-4 border-2 rounded-2xl" oninput="runRecommendation()">
        </div>

        <button onclick="runRecommendation()" 
                class="w-full py-6 bg-slate-900 text-white font-black text-xl rounded-3xl hover:bg-black">
            GET RECOMMENDATION
        </button>
    </div>

    <!-- Result -->
    <div id="result" class="hidden mt-8 bg-white rounded-3xl shadow p-8">
        <h2 id="drug_title" class="text-2xl font-black mb-4"></h2>
        <div id="status_box" class="p-6 rounded-2xl text-white text-center font-black text-2xl mb-6"></div>
        <div id="info" class="space-y-4 text-sm"></div>
    </div>
</div>

<script>
// Full accurate data from Table 4
const database = {
    "paracetamol": {name: "Paracetamol (Acetaminophen)", threshold: "200 mg/kg", maxH: 6, strength: "strong", grade: "B"},
    "carbamazepine": {name: "Carbamazepine", threshold: "25 mg/kg", maxH: 6, strength: "strong", grade: "C"},
    "phenobarbital": {name: "Phenobarbital", threshold: "20 mg/kg", maxH: 6, strength: "strong", grade: "C"},
    "salicylates": {name: "Salicylates (Aspirin)", threshold: "200 mg/kg", maxH: 6, strength: "strong", grade: "C"},
    "theophylline": {name: "Theophylline / Aminophylline", threshold: "20 mg/kg", maxH: 6, strength: "strong", grade: "C"},
    "valproate": {name: "Valproic acid / Valproate", threshold: "200 mg/kg", maxH: 6, strength: "strong", grade: "D"},
    "opioids": {name: "Opioids", threshold: "5 TD", maxH: 6, strength: "weak", grade: "D"},
    "iron": {name: "Iron", threshold: "No role", maxH: 0, strength: "none", grade: "C"},
    "lithium": {name: "Lithium", threshold: "No role", maxH: 0, strength: "none", grade: "D"},
    "metformin": {name: "Metformin", threshold: "No role", maxH: 0, strength: "none", grade: "D"},
    // Add more from the table as needed
};

let currentForm = "IR";

function populateDrugs() {
    const select = document.getElementById("drug");
    select.innerHTML = '<option value="">-- Select Poison --</option>';
    Object.keys(database).forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = database[key].name;
        select.appendChild(opt);
    });
}

function setForm(btn) {
    currentForm = btn.dataset.form;
    document.querySelectorAll('.form-btn').forEach(b => {
        if (b === btn) {
            b.classList.add("border-slate-900", "bg-slate-900", "text-white");
        } else {
            b.classList.remove("border-slate-900", "bg-slate-900", "text-white");
        }
    });
    runRecommendation();
}

function runRecommendation() {
    const key = document.getElementById("drug").value;
    if (!key) return;

    const drug = database[key];
    const hours = parseFloat(document.getElementById("hours").value);
    document.getElementById("hours_display").textContent = hours.toFixed(1) + " hours";

    let statusHTML = "";
    let statusClass = "";

    if (drug.strength === "none") {
        statusHTML = "❌ NO ROLE — Activated Charcoal is NOT recommended";
        statusClass = "status-none";
    } else if (hours > drug.maxH) {
        statusHTML = `⚠️ Beyond recommended window (max ${drug.maxH}h)`;
        statusClass = "bg-amber-500";
    } else if (drug.strength === "strong" && hours <= 4) {
        statusHTML = "✅ STRONG RECOMMENDATION — Single-dose AC is recommended";
        statusClass = "status-strong";
    } else {
        statusHTML = "🟡 WEAK RECOMMENDATION / INDIVIDUAL RISK ASSESSMENT";
        statusClass = "status-weak";
    }

    document.getElementById("result").classList.remove("hidden");
    document.getElementById("drug_title").textContent = drug.name;
    document.getElementById("status_box").innerHTML = statusHTML;
    document.getElementById("status_box").className = `p-6 rounded-2xl text-center font-black text-2xl mb-6 ${statusClass}`;
    
    document.getElementById("info").innerHTML = `
        <p><strong>Threshold:</strong> ${drug.threshold}</p>
        <p><strong>GRADE:</strong> ${drug.grade}</p>
        <p><strong>Formulation:</strong> ${currentForm}</p>
    `;
}

// Initialize
populateDrugs();
document.getElementById("hours").addEventListener("input", runRecommendation);
</script>
</body>
</html>
