<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activated Charcoal Tool 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #111827 0%, #1f2937 100%); }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

<div class="gradient-bg text-white py-8 px-4 mb-6 text-center">
    <h1 class="text-3xl font-bold mb-2">🖤 Activated Charcoal Recommendation Tool</h1>
    <p class="text-gray-300">Clin Tox Recommendations Collaborative (2026) — Complete Table 4</p>
</div>

<div class="max-w-4xl mx-auto px-4">
    <!-- Airway Safety Check -->
    <div class="card p-6 mb-6 border-l-8 border-red-600">
        <h2 class="text-xl font-bold text-red-700 mb-4 flex items-center">
            ⚠️ MANDATORY SAFETY CHECK
        </h2>
        <div class="space-y-3">
            <label class="flex items-center space-x-3 text-gray-700 cursor-pointer">
                <input type="checkbox" id="airway_check" class="w-5 h-5">
                <span>Patient has intact airway reflexes OR is intubated?</span>
            </label>
            <label class="flex items-center space-x-3 text-gray-700 cursor-pointer">
                <input type="checkbox" id="perforation_check" class="w-5 h-5">
                <span>NO risk of GI perforation or obstruction?</span>
            </label>
        </div>
    </div>

    <!-- Main Tool -->
    <div class="card p-6 shadow-xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Drug / Poison</label>
                <select id="drug_select" class="w-full p-3 border rounded-md bg-white focus:ring-2 focus:ring-black outline-none font-medium text-lg">
                    <option value="">Select a toxin (Full 2026 List)...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Formulation</label>
                <div class="flex space-x-4 pt-2">
                    <label class="flex items-center cursor-pointer"><input type="radio" name="form" value="IR" checked class="mr-2 w-4 h-4"> Immediate Release</label>
                    <label class="flex items-center cursor-pointer"><input type="radio" name="form" value="MR" class="mr-2 w-4 h-4"> Modified Release</label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Patient Weight (kg)</label>
                <input type="number" id="weight_input" value="70" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-black outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Time Since Ingestion (Hours)</label>
                <input type="range" id="hours_range" min="0" max="24" step="0.5" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-black">
                <div id="hours_display" class="text-center font-bold text-black mt-2 text-xl">1.0 hours</div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Estimated Ingested Dose</label>
                <div class="flex">
                    <input type="number" id="dose_input" placeholder="Amount" class="w-2/3 p-2 border border-r-0 rounded-l-md focus:ring-2 focus:ring-black outline-none text-lg">
                    <select id="unit_select" class="w-1/3 p-2 border rounded-r-md bg-gray-100 focus:ring-2 focus:ring-black outline-none font-medium cursor-pointer pr-8">
                        <option value="mgkg">mg/kg</option>
                        <option value="g">grams</option>
                        <option value="mg">mg</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="calculateRecommendation()" class="w-full bg-black text-white py-4 rounded-lg font-bold hover:bg-gray-800 transition active:scale-95 shadow-lg text-lg">
            GENERATE RECOMMENDATION
        </button>
    </div>

    <!-- Results Area -->
    <div id="result_area" class="mt-6 hidden">
        <div id="rec_card" class="card p-8 border-t-[12px] transition-all duration-300">
            <h3 id="res_title" class="text-3xl font-bold mb-2"></h3>
            <div id="res_strength" class="inline-block px-4 py-2 rounded text-base font-bold mb-6"></div>
            
            <div class="space-y-5">
                <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-inner">
                    <p id="res_logic" class="text-gray-800 text-lg leading-relaxed"></p>
                </div>

                <div id="dose_check_result" class="hidden p-4 rounded-lg border text-base font-medium"></div>
                
                <div id="special_notes" class="space-y-3"></div>
                
                <div id="footer_metadata" class="grid grid-cols-2 gap-4 text-sm border-t pt-6 mt-4">
                    <div>
                        <span class="text-gray-500 block uppercase tracking-tighter text-xs">Evidence Level</span>
                        <span id="res_grade" class="font-extrabold text-lg"></span>
                    </div>
                    <div>
                        <span class="text-gray-500 block uppercase tracking-tighter text-xs">Strong Rec. Threshold</span>
                        <span id="res_threshold" class="font-extrabold text-lg"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 text-center text-xs text-gray-500 italic space-y-1 pb-10">
        <p>Adult Standard Dose: 50g AC • Pediatric: 1g/kg (max 50g)</p>
        <p>Based on Table 4 - Consensus Statement 2026</p>
    </div>
</div>

<script>
/**
 * COMPLETE 2026 COLLABORATIVE TABLE 4 DATA
 */
const poisonsDb = {
    "amatoxin": { name: "Amatoxin-containing mushrooms", IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong recommendation within 2h." }, { max_h: 6, rec: "Weak", grade: "D", logic: "Suggested up to 6h if massive ingestion suspected." }] }, thresh: "Any ingestion", mdac: true },
    "amitriptyline": { name: "Amitriptyline (TCAs)", val: 10, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "C", logic: "Strong recommendation within 2h." }, { max_h: 6, rec: "Weak", grade: "C", logic: "Weakly suggested up to 6h for massive ingestion." }] }, thresh: "10 mg/kg", addDose: true },
    "amlodipine": { name: "Amlodipine (CCB)", val: null, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "baclofen": { name: "Baclofen", val: 2, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "≥2 mg/kg", addDose: false },
    "caffeine": { name: "Caffeine", val: 50, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h for life-threatening dose." }] }, thresh: "≥50 mg/kg", addDose: false, mdac: true },
    "carbamazepine": { name: "Carbamazepine", val: 25, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "C", logic: "Strong within 2h." }, { max_h: 6, rec: "Weak", grade: "C", logic: "Weakly suggested up to 6h." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "C", logic: "Strong within 4h for MR." }, { max_h: 12, rec: "Weak", grade: "C", logic: "Weakly suggested up to 12h." }] }, thresh: "25 mg/kg", addDose: true, mdac: true },
    "chloroquine": { name: "Chloroquine / Hydroxychloroquine", val: null, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "citalopram": { name: "Citalopram / Escitalopram", val: 400, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "C", logic: "Strong within 1h for massive doses." }, { max_h: 2, rec: "Weak", grade: "C", logic: "Weak up to 2h." }] }, thresh: "600mg (C) / 400mg (E)", addDose: true },
    "clozapine": { name: "Clozapine", val: null, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong recommendation within 2h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "colchicine": { name: "Colchicine", val: 0.3, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }, { max_h: 6, rec: "Weak", grade: "D", logic: "Weak up to 6h." }] }, thresh: "0.3 mg/kg", addDose: false },
    "dapsone": { name: "Dapsone", val: null, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }, { max_h: 6, rec: "Weak", grade: "D", logic: "Weak up to 6h." }] }, thresh: "Toxic Dose (TD)", addDose: true, mdac: true },
    "digoxin": { name: "Digoxin", val: 0.1, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "C", logic: "Strong within 2h for life-threatening doses." }] }, thresh: "0.1 mg/kg", addDose: false },
    "diltiazem": { name: "Diltiazem (CCB)", val: null, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weak within 1h for IR." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "D", logic: "Strong for MR within 4h." }, { max_h: 12, rec: "Weak", grade: "D", logic: "Weak up to 12h." }], addDoseOverride: true }, thresh: "Toxic Dose (TD)", addDose: false },
    "diphenhydramine": { name: "Diphenhydramine (Antihistamines)", val: 7.5, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h if massive dose." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "7.5 mg/kg", addDose: true },
    "ethylene_glycol": { name: "Ethylene Glycol", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "D", rec: "No Role" } },
    "fluoride": { name: "Fluoride", val: null, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h for lethal dose." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "iron": { name: "Iron", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "C", rec: "No Role" } },
    "isopropanol": { name: "Isopropanol", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "D", rec: "No Role" } },
    "lamotrigine": { name: "Lamotrigine", val: 15, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "C", logic: "Strong within 2h." }, { max_h: 4, rec: "Weak", grade: "C", logic: "Weak up to 4h." }] }, thresh: "15 mg/kg", addDose: true },
    "lithium": { name: "Lithium", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "D", rec: "No Role" } },
    "methanol": { name: "Methanol", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "D", rec: "No Role" } },
    "methotrexate": { name: "Methotrexate", val: null, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "olanzapine": { name: "Olanzapine", val: null, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "paracetamol": { name: "Paracetamol", val: 200, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "B", logic: "Strong within 2h." }, { max_h: 4, rec: "Weak", grade: "B", logic: "Weakly suggested up to 4h." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "B", logic: "Strong within 4h for MR." }, { max_h: 12, rec: "Weak", grade: "B", logic: "Weakly suggested up to 12h." }] }, thresh: "200 mg/kg or >7.5g", addDose: "conditional", mdac: false },
    "paraquat": { name: "Paraquat", IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }] }, thresh: "Any ingestion", addDose: false },
    "phenytoin": { name: "Phenytoin", val: 20, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "20 mg/kg", addDose: false, mdac: true },
    "potassium": { name: "Potassium", IR: { windows: [], logic_over: "Strongly recommended AGAINST (No Role).", grade: "D", rec: "No Role" } },
    "propranolol": { name: "Propranolol (Beta-blockers)", val: null, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "quetiapine": { name: "Quetiapine", val: 20, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }, { max_h: 6, rec: "Weak", grade: "D", logic: "Weak up to 6h for massive doses." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "D", logic: "Strong within 4h for MR." }, { max_h: 12, rec: "Weak", grade: "D", logic: "Weak up to 12h." }] }, thresh: "20 mg/kg", addDose: true },
    "quinine": { name: "Quinine / Quinidine", val: null, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "Toxic Dose (TD)", addDose: true, mdac: true },
    "salicylates": { name: "Salicylates (Aspirin)", val: 150, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "C", logic: "Strongly recommended within 2h." }, { max_h: 6, rec: "Weak", grade: "C", logic: "Weakly suggested up to 6h." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "C", logic: "Strongly recommended within 4h." }, { max_h: 12, rec: "Weak", grade: "C", logic: "Weakly suggested up to 12h." }] }, thresh: "150 mg/kg", addDose: true, mdac: true },
    "selective_beta_blockers": { name: "Selective Beta-Blockers", val: null, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "sodium_valproate": { name: "Sodium Valproate", val: 200, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }, { max_h: 6, rec: "Weak", grade: "D", logic: "Weakly suggested up to 6h." }] }, thresh: "200 mg/kg", addDose: true, mdac: false },
    "sotalol": { name: "Sotalol", val: 10, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "10 mg/kg", addDose: false },
    "sulfonylureas": { name: "Sulfonylureas", IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weakly suggested within 1h." }] }, thresh: "Any dose", addDose: false },
    "thallium": { name: "Thallium", IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "Any dose", addDose: true, mdac: false },
    "theophylline": { name: "Theophylline", val: null, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "C", logic: "Strong within 1h." }, { max_h: 2, rec: "Weak", grade: "C", logic: "Weak up to 2h." }] }, MR: { windows: [{ max_h: 3, rec: "Strong", grade: "C", logic: "Strong within 3h." }, { max_h: 6, rec: "Weak", grade: "C", logic: "Weak up to 6h." }] }, thresh: "Toxic Dose (TD)", addDose: true, mdac: true },
    "tramadol": { name: "Tramadol", val: null, IR: { windows: [{ max_h: 2, rec: "Strong", grade: "D", logic: "Strong within 2h." }] }, thresh: "Toxic Dose (TD)", addDose: false },
    "venlafaxine": { name: "Venlafaxine", val: 30, IR: { windows: [{ max_h: 1, rec: "Strong", grade: "D", logic: "Strong within 1h for massive dose." }, { max_h: 2, rec: "Weak", grade: "D", logic: "Weak up to 2h." }] }, thresh: "30 mg/kg", addDose: true },
    "verapamil": { name: "Verapamil (CCB)", val: null, IR: { windows: [{ max_h: 1, rec: "Weak", grade: "D", logic: "Weak within 1h for IR." }] }, MR: { windows: [{ max_h: 4, rec: "Strong", grade: "D", logic: "Strong for MR within 4h." }, { max_h: 12, rec: "Weak", grade: "D", logic: "Weak up to 12h." }], addDoseOverride: true }, thresh: "Toxic Dose (TD)", addDose: false }
};

const select = document.getElementById('drug_select');
Object.keys(poisonsDb).sort((a,b) => poisonsDb[a].name.localeCompare(poisonsDb[b].name)).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = poisonsDb[key].name;
    select.appendChild(opt);
});

const slider = document.getElementById('hours_range');
slider.oninput = function() {
    document.getElementById('hours_display').textContent = parseFloat(this.value).toFixed(1) + " hours";
};

function calculateRecommendation() {
    const airway = document.getElementById('airway_check').checked;
    const perforation = document.getElementById('perforation_check').checked;
    const drugKey = select.value;
    const formType = document.querySelector('input[name="form"]:checked').value;
    const hours = parseFloat(slider.value);
    const weight = parseFloat(document.getElementById('weight_input').value) || 70;
    const doseRaw = parseFloat(document.getElementById('dose_input').value);
    const unit = document.getElementById('unit_select').value;
    const resultArea = document.getElementById('result_area');

    if (!drugKey) return;
    resultArea.classList.remove('hidden');

    const drug = poisonsDb[drugKey];
    const configSet = (formType === 'MR' && drug.MR) ? drug.MR : drug.IR;

    const card = document.getElementById('rec_card');
    const title = document.getElementById('res_title');
    const strength = document.getElementById('res_strength');
    const logicEl = document.getElementById('res_logic');
    const doseEl = document.getElementById('dose_check_result');
    const notes = document.getElementById('special_notes');
    const footer = document.getElementById('footer_metadata');

    title.textContent = `${drug.name} (${formType})`;
    notes.innerHTML = "";
    doseEl.classList.add('hidden');
    footer.classList.add('hidden');

    // 1. Mandatory Contraindications
    if (!airway || !perforation) {
        card.style.borderColor = "#ef4444";
        strength.textContent = "ABSOLUTE CONTRAINDICATION";
        strength.className = "inline-block px-4 py-2 rounded text-base font-bold mb-4 bg-red-100 text-red-700 uppercase";
        logicEl.innerHTML = "<strong>CRITICAL SAFETY ALERT:</strong> AC must NOT be administered if airway reflexes are impaired or there is a risk of GI perforation/obstruction.";
        return;
    }

    // 2. No Role Drugs
    if (configSet.rec === "No Role") {
        card.style.borderColor = "#6b7280";
        strength.textContent = "AC NOT RECOMMENDED (NO ROLE)";
        strength.className = "inline-block px-4 py-2 rounded text-base font-bold mb-4 bg-gray-200 text-gray-700";
        logicEl.textContent = configSet.logic_over;
        return;
    }

    // Normalized Dose Calculation
    let doseInMgKg = null;
    let totalDoseInGrams = null;
    if (!isNaN(doseRaw)) {
        if (unit === 'mgkg') {
            doseInMgKg = doseRaw;
            totalDoseInGrams = (doseRaw * weight) / 1000;
        } else if (unit === 'g') {
            totalDoseInGrams = doseRaw;
            doseInMgKg = (doseRaw * 1000) / weight;
        } else if (unit === 'mg') {
            totalDoseInGrams = doseRaw / 1000;
            doseInMgKg = doseRaw / weight;
        }
    }

    // 3. Find Time Window
    const windows = configSet.windows || [];
    let activeWin = null;
    for (let win of windows) {
        if (hours <= win.max_h) {
            activeWin = win;
            break; 
        }
    }

    // 4. Recommendation Logic
    if (activeWin) {
        
        // --- DOSE THRESHOLD CHECK LOGIC ---
        let doseBelowThreshold = false;
        
        // Case A: Paracetamol Special Handling (>7.5g is always toxic)
        if (drugKey === 'paracetamol' && totalDoseInGrams !== null) {
            if (totalDoseInGrams > 7.5) {
                doseBelowThreshold = false; // Massive dose, verified toxic
            } else if (doseInMgKg !== null && doseInMgKg < drug.val) {
                doseBelowThreshold = true;
            }
        } 
        // Case B: Fixed numeric threshold (e.g. Salicylates 150 mg/kg)
        else if (drug.val !== null && doseInMgKg !== null) {
            if (doseInMgKg < drug.val) {
                doseBelowThreshold = true;
            }
        }
        // Case C: TD Reference (Like Amlodipine) -> Skip quantitative check
        else {
            doseBelowThreshold = false; 
        }

        if (doseBelowThreshold) {
            // BELOW THRESHOLD REJECTION
            card.style.borderColor = "#f59e0b";
            strength.textContent = "NOT RECOMMENDED (Dose Below Threshold)";
            strength.className = "inline-block px-4 py-2 rounded text-base font-bold mb-4 bg-yellow-100 text-yellow-700";
            logicEl.textContent = `Ingested dose (~${doseInMgKg.toFixed(1)} mg/kg) is below the fixed threshold for a "Strong Recommendation" (${drug.val} mg/kg). At this low dose, risk of AC (aspiration/obstruction) likely outweighs the clinical benefit.`;
            return;
        }

        // --- POSITIVE RECOMMENDATION ---
        const isStrong = activeWin.rec === "Strong";
        card.style.borderColor = isStrong ? "#10b981" : "#3b82f6";
        strength.textContent = isStrong ? "STRONG RECOMMENDATION FOR AC" : "WEAK RECOMMENDATION / SUGGESTED";
        strength.className = `inline-block px-4 py-2 rounded text-base font-bold mb-4 ${isStrong ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`;
        logicEl.textContent = activeWin.logic;
        
        // Show metadata footer
        footer.classList.remove('hidden');
        document.getElementById('res_grade').textContent = "Grade " + activeWin.grade;
        document.getElementById('res_threshold').textContent = drug.thresh || "Toxic Dose";

        // Dose Verification UI
        if (doseInMgKg !== null) {
            doseEl.classList.remove('hidden');
            let doseMsg = `Calculated dose: ~${doseInMgKg.toFixed(1)} mg/kg.`;
            if (drugKey === 'paracetamol' && totalDoseInGrams > 7.5) doseMsg += ` (Exceeds 7.5g absolute threshold).`;
            
            if (drug.val === null) {
                doseEl.className = "p-4 rounded-lg border text-base bg-blue-50 border-blue-200 text-blue-800";
                doseEl.innerHTML = `ℹ️ <strong>Dose Note:</strong> ${doseMsg} Standard "Toxic Dose" threshold applies for this substance.`;
            } else {
                doseEl.className = "p-4 rounded-lg border text-base bg-green-50 border-green-200 text-green-800";
                doseEl.innerHTML = `✅ <strong>Threshold Verified:</strong> ${doseMsg} Dose exceeds established ${drug.val} mg/kg guideline.`;
            }
        }

        // Additional Dose Logic
        let showAddDose = false;
        if (drug.addDose === true) showAddDose = true;
        if (drug.addDose === "conditional" && (doseInMgKg >= 500 || (unit === 'g' && doseRaw >= 35))) showAddDose = true; 
        if (formType === 'MR' && configSet.addDoseOverride) showAddDose = true; 

        if (showAddDose && hours <= 12) {
            const div = document.createElement('div');
            div.className = "p-4 bg-blue-50 text-blue-900 border-l-4 border-blue-500 rounded text-base font-medium shadow-sm";
            div.innerHTML = `📘 <strong>Table 4 Update:</strong> Consider an <strong>additional single dose</strong> of AC (approx 25g) if the initial dose was tolerated.`;
            notes.appendChild(div);
        }
        
        // MDAC Logic
        if (drug.mdac && hours <= 12) {
            const div = document.createElement('div');
            div.className = "p-4 bg-purple-50 text-purple-900 border-l-4 border-purple-500 rounded text-base font-medium shadow-sm";
            div.innerHTML = `🔄 <strong>MDAC:</strong> This toxin is identified as a candidate for <strong>Multiple-Dose Activated Charcoal</strong> therapy.`;
            notes.appendChild(div);
        }

    } else {
        // OUT OF WINDOW
        card.style.borderColor = "#f59e0b"; 
        strength.textContent = "NOT RECOMMENDED (OUT OF WINDOW)";
        strength.className = "inline-block px-4 py-2 rounded text-base font-bold mb-4 bg-yellow-100 text-yellow-700";
        logicEl.textContent = configSet.logic_over || `Patient is outside the recommended timeframe for ${drug.name} (${hours} hours). Risks generally exceed benefits beyond clinical windows.`;
    }

    resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
