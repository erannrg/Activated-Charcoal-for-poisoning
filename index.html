<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
  <div class="md:col-span-2">
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Drug Agent (select from list)</label>
    <input id="drugSearch" list="drugList" placeholder="Search drug..." class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none" />
    <datalist id="drugList"></datalist>
  </div>

  <div class="grid grid-cols-2 gap-2">
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Formulation</label>
      <select id="formSelect" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none">
        <option value="IR">IR</option>
        <option value="MR">MR</option>
        <option value="Any">Any</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Intent</label>
      <select id="intentSelect" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none">
        <option value="SDAC">SDAC</option>
        <option value="ADAC">ADAC</option>
      </select>
    </div>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Time Since Ingestion (h)</label>
    <input id="hoursInput" type="number" step="0.5" placeholder="e.g., 2.5" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Patient Weight (kg)</label>
    <input id="weightInput" type="number" placeholder="(optional)" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Estimated Dose (value)</label>
    <input id="doseInput" type="number" placeholder="(optional)" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none" />
  </div>
  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Dose Unit</label>
    <select id="unitSelect" class="w-full p-3 bg-slate-100 rounded-xl font-bold border outline-none">
      <option value="">(optional)</option>
      <option value="mg/kg">mg/kg</option>
      <option value="mg">mg</option>
      <option value="g">g</option>
      <option value="TD">TD</option>
      <option value="seeds">seeds</option>
      <option value="µg/kg">µg/kg</option>
      <option value="Any dose">Any dose</option>
      <option value="Individual Risk">Individual Risk</option>
    </select>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="adacFlags">
  <div class="col-span-4">
    <p class="text-xs font-bold text-slate-500 uppercase mb-2">Optional ADAC Triggers</p>
  </div>
  <label class="inline-flex items-center space-x-2">
    <input id="flagBezoar" type="checkbox" class="size-4 rounded border-slate-300" />
    <span class="text-slate-700 text-sm font-semibold">Pharmacobezoar</span>
  </label>
  <label class="inline-flex items-center space-x-2">
    <input id="flagMR" type="checkbox" class="size-4 rounded border-slate-300" />
    <span class="text-slate-700 text-sm font-semibold">Modified-release formulation</span>
  </label>
  <label class="inline-flex items-center space-x-2">
    <input id="flagBurden" type="checkbox" class="size-4 rounded border-slate-300" />
    <span class="text-slate-700 text-sm font-semibold">High drug burden</span>
  </label>
  <label class="inline-flex items-center space-x-2">
    <input id="flagGastro" type="checkbox" class="size-4 rounded border-slate-300" />
    <span class="text-slate-700 text-sm font-semibold">Induced gastroparesis</span>
  </label>
</div>

<button id="btnEval" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-black transition-all">
  Evaluate Recommendation
</button>

<div id="result" class="mt-8 p-6 rounded-2xl border hidden font-bold text-base"></div>
<div id="debug" class="mt-3 text-xs text-slate-500"></div>
